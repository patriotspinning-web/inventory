<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patriot ERP – Complete Spinning Mill Inventory</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        brand: { 50:'#eef4ff', 100:'#dbe6ff', 500:'#3a5ffc', 600:'#2541f1', 700:'#1e32d8', 800:'#1e2cae', 900:'#1e2b89' },
        cotton: { 50:'#fef7ed', 100:'#fdecd4', 500:'#ee7518', 600:'#df5c0f', 700:'#b94510' },
        waste: { 50:'#fef2f2', 100:'#fee2e2', 500:'#ef4444', 600:'#dc2626', 700:'#b91c1c' },
        spare: { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d' },
        yarn: { 50:'#f0f9ff', 100:'#e0f2fe', 500:'#0ea5e9', 600:'#0284c7', 700:'#0369a1' },
        quality: { 50:'#faf5ff', 100:'#f3e8ff', 500:'#a855f7', 600:'#9333ea', 700:'#7e22ce' }
      },
      fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] }
    }
  }
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(100,116,139,.35); border-radius: 4px; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .nav-item.active { background-color: rgb(37 99 235); color: white; }
  .nav-item.active svg { color: white; }
  .dark .nav-item.active { background-color: rgb(37 99 235); }
  @media print { .no-print { display: none !important; } body { background: white !important; color: black !important; } }
  .badge { display:inline-flex; align-items:center; padding:2px 10px; border-radius:9999px; font-size:11px; font-weight:600; }
  .modal-backdrop { backdrop-filter: blur(4px); }
  .auto-calc-field { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px dashed #f59e0b !important; font-weight: 600; color: #92400e; }
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased">

<div x-data="app()" x-init="init()" class="min-h-screen">

<!-- LOGIN SCREEN -->
<template x-if="!auth.isAuthenticated">
<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-brand-600 via-brand-700 to-slate-900 relative overflow-hidden">
  <div class="absolute inset-0 opacity-20">
    <div class="absolute top-20 left-20 w-72 h-72 bg-white rounded-full blur-3xl"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-brand-400 rounded-full blur-3xl"></div>
  </div>
  <div class="relative w-full max-w-5xl grid md:grid-cols-2 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl overflow-hidden">
    <div class="hidden md:flex flex-col justify-between p-10 bg-gradient-to-br from-brand-600 to-brand-800 text-white">
      <div>
        <div class="flex items-center gap-3 mb-8">
          <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur"><i data-lucide="factory" class="w-7 h-7"></i></div>
          <div><h1 class="text-2xl font-bold">Patriot ERP</h1><p class="text-brand-100 text-sm">Complete Spinning Mill Inventory</p></div>
        </div>
        <h2 class="text-3xl font-bold leading-tight mb-4">Unified Inventory Control</h2>
        <p class="text-brand-100 leading-relaxed">Cotton, Wastage, Spare Parts, Yarn, and Quality Testing in one integrated system.</p>
      </div>
      <div class="space-y-2 mt-8">
        <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Cotton Inventory (26 countries)</span></div>
        <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Wastage Management (20 categories)</span></div>
        <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Spare Parts (1800+ items)</span></div>
        <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Yarn & Quality (HVI/Uster)</span></div>
      </div>
      <p class="text-xs text-brand-200 mt-8">© 2026 Patriot Spinning Mills Ltd. · Bangladesh</p>
    </div>
    <div class="p-8 md:p-12">
      <h3 class="text-2xl font-bold mb-2">Welcome back</h3>
      <p class="text-slate-500 dark:text-slate-400 mb-8">Sign in to access the system</p>
      <form @submit.prevent="login()" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-2">Email</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="email" x-model="auth.email" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 focus:ring-2 focus:ring-brand-500 outline-none" placeholder="store@patriot.com" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input :type="showPassword ? 'text' : 'password'" x-model="auth.password" required class="w-full pl-10 pr-10 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 focus:ring-2 focus:ring-brand-500 outline-none" placeholder="••••••••" />
            <button type="button" @click="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div x-show="auth.error" x-transition class="bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm p-3 rounded-lg">
          <span x-text="auth.error"></span>
        </div>
        <button type="submit" :disabled="auth.loading" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-50 flex items-center justify-center gap-2">
          <span x-text="auth.loading ? 'Signing in...' : 'Sign In'"></span>
        </button>
      </form>
      <div class="mt-6 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600">
        <p class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-2">Demo Accounts:</p>
        <div class="text-xs text-slate-500 dark:text-slate-400 space-y-1">
          <div><span class="font-medium">Store Manager:</span> store@patriot.com / password</div>
          <div><span class="font-medium">Super Admin:</span> admin@patriot.com / password</div>
          <div class="mt-2 pt-2 border-t border-slate-200 dark:border-slate-600"><span class="font-medium">Admin Password (for Delete/Edit):</span> <code class="bg-slate-200 dark:bg-slate-800 px-2 py-0.5 rounded">@admin</code></div>
        </div>
      </div>
    </div>
  </div>
</div>
</template>

<!-- MAIN APP -->
<template x-if="auth.isAuthenticated">
<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside :class="ui.sidebarOpen ? 'w-64' : 'w-20'" class="no-print fixed left-0 top-0 h-screen bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transition-all duration-300 z-40 flex flex-col">
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-2 overflow-hidden" x-show="ui.sidebarOpen" x-transition>
        <div class="w-9 h-9 bg-gradient-to-br from-brand-500 to-brand-700 rounded-lg flex items-center justify-center flex-shrink-0">
          <i data-lucide="factory" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm leading-tight">Patriot ERP</h1>
          <p class="text-[10px] text-slate-500 dark:text-slate-400 leading-tight">Spinning Mill</p>
        </div>
      </div>
      <button @click="ui.sidebarOpen = !ui.sidebarOpen" class="p-1.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700 transition">
        <i :data-lucide="ui.sidebarOpen ? 'panel-left-close' : 'panel-left-open'" class="w-5 h-5"></i>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto p-3 space-y-1">
      <button @click="navigate('dashboard')" :class="currentModule === 'dashboard' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition">
        <i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Dashboard</span>
      </button>

      <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-cotton-600 dark:text-cotton-400 uppercase">Cotton Inventory</span></div>
      <button @click="navigate('cotton-receive')" :class="currentModule === 'cotton-receive' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Receive</span></button>
      <button @click="navigate('cotton-issue')" :class="currentModule === 'cotton-issue' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Issue Cotton</span></button>
      <button @click="navigate('cotton-stock')" :class="currentModule === 'cotton-stock' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Stock</span></button>
      <button @click="navigate('cotton-reports')" :class="currentModule === 'cotton-reports' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="file-bar-chart" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Reports</span></button>

      <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-waste-600 dark:text-waste-400 uppercase">Wastage Management</span></div>
      <button @click="navigate('waste-receive')" :class="currentModule === 'waste-receive' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Receive</span></button>
      <button @click="navigate('waste-issue')" :class="currentModule === 'waste-issue' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Issue</span></button>
      <button @click="navigate('waste-stock')" :class="currentModule === 'waste-stock' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Stock</span></button>
      <button @click="navigate('waste-reports')" :class="currentModule === 'waste-reports' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="file-bar-chart" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Reports</span></button>

      <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-spare-600 dark:text-spare-400 uppercase">Spare Parts</span></div>
      <button @click="navigate('spare-items')" :class="currentModule === 'spare-items' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="database" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Items Master</span></button>
      <button @click="navigate('spare-receive')" :class="currentModule === 'spare-receive' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Spare Receive</span></button>
      <button @click="navigate('spare-issue')" :class="currentModule === 'spare-issue' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Spare Issue</span></button>
      <button @click="navigate('spare-stock')" :class="currentModule === 'spare-stock' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Spare Stock</span></button>
      <button @click="navigate('spare-reports')" :class="currentModule === 'spare-reports' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="file-bar-chart" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Spare Reports</span></button>

      <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-yarn-600 dark:text-yarn-400 uppercase">Yarn Inventory</span></div>
      <button @click="navigate('yarn-receive')" :class="currentModule === 'yarn-receive' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Yarn Receive</span></button>
      <button @click="navigate('yarn-issue')" :class="currentModule === 'yarn-issue' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Yarn Issue</span></button>
      <button @click="navigate('yarn-stock')" :class="currentModule === 'yarn-stock' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Yarn Stock</span></button>

      <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-quality-600 dark:text-quality-400 uppercase">Quality Testing</span></div>
      <button @click="navigate('hvi-reports')" :class="currentModule === 'hvi-reports' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="microscope" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">HVI Test Reports</span></button>
      <button @click="navigate('uster-reports')" :class="currentModule === 'uster-reports' ? 'active' : 'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="test-tube" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Uster Test Reports</span></button>
    </nav>

    <div class="p-3 border-t border-slate-200 dark:border-slate-700">
      <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/60 cursor-pointer">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-semibold flex-shrink-0" x-text="auth.user?.name?.charAt(0) || 'U'"></div>
        <div class="flex-1 overflow-hidden" x-show="ui.sidebarOpen" x-transition>
          <p class="text-sm font-semibold truncate" x-text="auth.user?.name"></p>
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate" x-text="auth.user?.role"></p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div :class="ui.sidebarOpen ? 'ml-64' : 'ml-20'" class="flex-1 transition-all duration-300 flex flex-col min-h-screen">
    <header class="no-print sticky top-0 z-30 h-16 bg-white/80 dark:bg-slate-800/80 backdrop-blur border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6">
      <div>
        <h2 class="text-lg font-bold" x-text="currentModuleLabel()"></h2>
        <p class="text-xs text-slate-500 dark:text-slate-400" x-text="currentModuleSubtext()"></p>
      </div>
      <div class="flex items-center gap-2">
        <button @click="toggleTheme()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          <i :data-lucide="ui.theme === 'dark' ? 'sun' : 'moon'" class="w-5 h-5"></i>
        </button>
        <div class="relative">
          <button @click="ui.userMenuOpen = !ui.userMenuOpen" class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-semibold text-sm" x-text="auth.user?.name?.charAt(0)"></div>
          </button>
          <div x-show="ui.userMenuOpen" @click.away="ui.userMenuOpen = false" x-transition class="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl">
            <div class="p-3 border-b border-slate-200 dark:border-slate-700">
              <p class="text-sm font-semibold" x-text="auth.user?.name"></p>
              <p class="text-xs text-slate-500" x-text="auth.user?.email"></p>
            </div>
            <button @click="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-2">
              <i data-lucide="log-out" class="w-4 h-4"></i> Sign Out
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 p-6">
      
      <!-- DASHBOARD -->
      <template x-if="currentModule === 'dashboard'">
        <div class="space-y-6 fade-in">
          <div class="bg-gradient-to-r from-brand-600 to-brand-700 rounded-xl p-6 text-white">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur"><i data-lucide="layout-dashboard" class="w-6 h-6"></i></div>
              <div><h1 class="text-2xl font-bold">Dashboard</h1><p class="text-sm text-brand-100">Real-time overview · <span x-text="new Date().toLocaleDateString('en-GB')"></span></p></div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-gradient-to-br from-cotton-500 to-cotton-600 rounded-xl p-5 text-white">
              <p class="text-xs text-cotton-100 font-medium">Cotton Stock</p>
              <p class="text-3xl font-bold" x-text="cottonTotalStock() + ' Bale'"></p>
            </div>
            <div class="bg-gradient-to-br from-waste-500 to-waste-600 rounded-xl p-5 text-white">
              <p class="text-xs text-waste-100 font-medium">Wastage Stock</p>
              <p class="text-3xl font-bold" x-text="formatKg(wasteTotalStock())"></p>
            </div>
            <div class="bg-gradient-to-br from-spare-500 to-spare-600 rounded-xl p-5 text-white">
              <p class="text-xs text-spare-100 font-medium">Spare Parts</p>
              <p class="text-3xl font-bold" x-text="spareItems.length + ' Items'"></p>
            </div>
            <div class="bg-gradient-to-br from-yarn-500 to-yarn-600 rounded-xl p-5 text-white">
              <p class="text-xs text-yarn-100 font-medium">Yarn Stock</p>
              <p class="text-3xl font-bold" x-text="formatKg(yarnTotalStock())"></p>
            </div>
          </div>
        </div>
      </template>

      <!-- COTTON RECEIVE -->
      <template x-if="currentModule === 'cotton-receive'">
        <div class="space-y-6 fade-in">
          <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
            <h1 class="text-2xl font-bold">Cotton Receive</h1>
            <p class="text-sm text-slate-500">Stock automatically added on save · 26 countries supported</p>
          </div>
          <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">

<script>
function app() {
  return {
    auth: { isAuthenticated: false, user: null, email: 'store@patriot.com', password: 'password', loading: false, error: null },
    showPassword: false,
    ui: { theme: 'light', sidebarOpen: true, userMenuOpen: false },
    currentModule: 'dashboard',
    toasts: [],

    cottonCountries: ['India','China','Brazil','Bangladesh','United States','Pakistan','Australia','Turkey','Uzbekistan','Argentina','Greece','Benin','Mali','Burkina Faso',"Côte d'Ivoire",'Turkmenistan','Tajikistan','Egypt','Sudan','Mexico','Tanzania','Zimbabwe','Cameroon','Chad','Mozambique','Nigeria'],
    wasteCategories: ['Pneumafil (PSML)','Sliver','Cotton Bonda (Tongi)','Roving / Bonda','Dropping-1 (Ring)','Dropping-2 (Ring) – Process','Dropping-1 (Rotor) 16+20','Process D-1 (Rotor) 06+10','Process D-2 (Rotor) 06+10','Process D-1 (Rotor) 16+20','Process D-2 (Rotor) 16+20','Flat Strip / Ukon Dust (Rotor)','Hard Waste','Hard Waste (Reprocess)','Sweeping','Filter Waste','A/C Waste','Bushy – From D-2 Reprocess','Micro Dust','Balling Cloth Wastage'],
    spareSections: ['Autocone (Savio)','Autocone (Muratec)','BRC Trutzschler','BRC Rieter','Drawing (Rieter)','Simplex','Ring','AC Plant','HVI','Rotor','Production','Bearing','Stationary','Lubricating','Paint & Vernish','Work Shop','F & Vehicle','Electric (General)','Tools','Hard Ware','Belt (Rotor)','Belt (All Section)','Civil','Gen & Com'],

    cottonReceives: [], cottonIssues: [],
    wasteReceives: [], wasteIssues: [],
    spareItems: [], spareReceives: [], spareIssues: [],
    yarnReceives: [], yarnIssues: [],
    hviReports: [], usterReports: [],

    cottonReceiveForm: { origin:'', consignment:'', fiberLength:'', lcNo:'', idCode:'', date:'', lcQuantity:0, actualReceive:0, actualReceiveKg:0, remarks:'' },
    cottonIssueForm: { srNo:'', date:'', origin:'', consignment:'', processType:'', department:'', baleQty:0, weightKg:0, remarks:'' },
    wasteReceiveForm: { category:'', receiveFrom:'', date:'', quantity:0, receivedBy:'', remarks:'' },
    wasteIssueForm: { srNo:'', date:'', category:'', issueTo:'', issueType:'', quantity:0, issuedBy:'', remarks:'' },
    spareReceiveForm: { itemId:'', quantity:0, mrrNo:'', date:'', remarks:'' },
    spareIssueForm: { itemId:'', quantity:0, issueTo:'', srNo:'', date:'', remarks:'' },
    yarnReceiveForm: { count:'', lotNo:'', process:'', quantity:0, bags:0, date:'', remarks:'' },
    yarnIssueForm: { count:'', lotNo:'', process:'', issueTo:'', quantity:0, bags:0, date:'', remarks:'' },
    hviForm: { id:null, testDate:'', consignment:'', mic:'', uhml:'', ui:'', strength:'', elongation:'', sfi:'', moisture:'', rd:'', yellowness:'', colorGrade:'', trashCnt:0, trashAr:0, sci:0, remarks:'' },
    usterForm: { id:null, testDate:'', lotNo:'', count:'', process:'', machine:'', cvm:'', unevenness:'', thinPlaces:'', thickPlaces:'', neps:'', ipi:'', hairiness:'', csp:'', remarks:'' },

    addCountryModal: { open: false, countryName: '' },
    addWasteCategoryModal: { open: false, categoryName: '' },
    adminModal: { open: false, password: '', error: '', action: '', data: null, pendingAction: null },
    showAdminPassword: false,

    init() {
      const savedTheme = localStorage.getItem('patriot-theme') || 'light';
      this.setTheme(savedTheme);
      const savedAuth = localStorage.getItem('patriot-auth');
      if (savedAuth) { try { const p = JSON.parse(savedAuth); this.auth = { ...this.auth, ...p, isAuthenticated: true }; } catch(e) {} }
      
      const savedData = localStorage.getItem('patriot-data');
      if (savedData) {
        try {
          const d = JSON.parse(savedData);
          this.cottonReceives = d.cottonReceives || [];
          this.cottonIssues = d.cottonIssues || [];
          this.wasteReceives = d.wasteReceives || [];
          this.wasteIssues = d.wasteIssues || [];
          this.spareItems = d.spareItems || [];
          this.spareReceives = d.spareReceives || [];
          this.spareIssues = d.spareIssues || [];
          this.yarnReceives = d.yarnReceives || [];
          this.yarnIssues = d.yarnIssues || [];
          this.hviReports = d.hviReports || [];
          this.usterReports = d.usterReports || [];
        } catch(e) { this.seedData(); }
      } else {
        this.seedData();
      }
      this.$nextTick(() => lucide.createIcons());
    },

    seedData() {
      const today = new Date().toISOString().split('T')[0];
      this.cottonReceives = [{ id: 1, date: today, origin: 'Brazil', consignment: 'CON-2026-001', fiberLength: '1-3/32', lcNo: '03', idCode: 'BR-001', lcQuantity: 1500, actualReceive: 500, actualReceiveKg: 85000, remarks: 'Demo' }];
      this.spareItems = [
        { id: 1, name: 'Ball Bearing-607', partNumber: '607-2RS', section: 'Bearing', source: 'Local Spare Parts', openingStock: 50, currentStock: 50, minStock: 10, unit: 'Pcs' },
        { id: 2, name: 'Ring Traveler', partNumber: 'RT-001', section: 'Ring', source: 'Maintenance Import', openingStock: 100, currentStock: 100, minStock: 20, unit: 'Pcs' }
      ];
      this.saveData();
    },

    saveData() {
      localStorage.setItem('patriot-data', JSON.stringify({
        cottonReceives: this.cottonReceives, cottonIssues: this.cottonIssues,
        wasteReceives: this.wasteReceives, wasteIssues: this.wasteIssues,
        spareItems: this.spareItems, spareReceives: this.spareReceives, spareIssues: this.spareIssues,
        yarnReceives: this.yarnReceives, yarnIssues: this.yarnIssues,
        hviReports: this.hviReports, usterReports: this.usterReports
      }));
    },

    formatKg(kg) { return Math.round(kg).toLocaleString() + ' kg'; },
    generateCottonSRNo() { return 'SR-C-' + new Date().getFullYear() + '-' + String(this.cottonIssues.length + 1).padStart(3, '0'); },
    generateWasteSRNo() { return 'SR-W-' + new Date().getFullYear() + '-' + String(this.wasteIssues.length + 1).padStart(3, '0'); },

    navigate(id) { this.currentModule = id; this.ui.userMenuOpen = false; this.$nextTick(() => lucide.createIcons()); },
    currentModuleLabel() {
      const labels = { 'dashboard': 'Dashboard', 'cotton-receive': 'Cotton Receive', 'cotton-issue': 'Issue Cotton', 'cotton-stock': 'Cotton Stock', 'cotton-reports': 'Cotton Reports', 'waste-receive': 'Wastage Receive', 'waste-issue': 'Wastage Issue', 'waste-stock': 'Wastage Stock', 'waste-reports': 'Wastage Reports', 'spare-items': 'Items Master', 'spare-receive': 'Spare Receive', 'spare-issue': 'Spare Issue', 'spare-stock': 'Spare Stock', 'spare-reports': 'Spare Reports', 'yarn-receive': 'Yarn Receive', 'yarn-issue': 'Yarn Issue', 'yarn-stock': 'Yarn Stock', 'hvi-reports': 'HVI Test Reports', 'uster-reports': 'Uster Test Reports' };
      return labels[this.currentModule] || '';
    },
    currentModuleSubtext() {
      const subtexts = { 'dashboard': 'Overview', 'cotton-receive': 'Receive cotton from 26 countries', 'cotton-issue': 'Issue cotton with auto weight calculation', 'cotton-stock': 'Cotton stock balance', 'cotton-reports': 'Cotton reports & exports', 'waste-receive': 'Receive wastage', 'waste-issue': 'Issue wastage', 'waste-stock': 'Wastage stock balance', 'waste-reports': 'Wastage reports & exports', 'spare-items': 'Manage spare parts', 'spare-receive': 'Receive spare parts', 'spare-issue': 'Issue spare parts', 'spare-stock': 'Stock status', 'spare-reports': 'Spare parts reports', 'yarn-receive': 'Receive yarn', 'yarn-issue': 'Issue yarn', 'yarn-stock': 'Yarn stock balance', 'hvi-reports': 'HVI test reports with quality parameters', 'uster-reports': 'Uster evenness test reports' };
      return subtexts[this.currentModule] || '';
    },

    // COTTON FUNCTIONS
    cottonTotalReceived() { return this.cottonReceives.reduce((s, r) => s + r.actualReceive, 0); },
    cottonTotalIssued() { return this.cottonIssues.reduce((s, i) => s + i.baleQty, 0); },
    cottonTotalStock() { return this.cottonTotalReceived() - this.cottonTotalIssued(); },
    cottonActiveLots() { return new Set(this.cottonReceives.map(r => r.consignment)).size; },

    getAllCottonLots() {
      const lotMap = {};
      this.cottonReceives.forEach(r => {
        if (!lotMap[r.consignment]) lotMap[r.consignment] = { consignment: r.consignment, origin: r.origin, lcNo: r.lcNo, receivedBale: 0, receivedKg: 0, issuedBale: 0, issuedKg: 0 };
        lotMap[r.consignment].receivedBale += r.actualReceive;
        lotMap[r.consignment].receivedKg += r.actualReceiveKg;
      });
      this.cottonIssues.forEach(i => {
        if (!lotMap[i.consignment]) lotMap[i.consignment] = { consignment: i.consignment, origin: i.origin, lcNo: '', receivedBale: 0, receivedKg: 0, issuedBale: 0, issuedKg: 0 };
        lotMap[i.consignment].issuedBale += i.baleQty;
        lotMap[i.consignment].issuedKg += i.weightKg;
      });
      return Object.values(lotMap).map(l => ({ ...l, balanceBale: l.receivedBale - l.issuedBale, balanceKg: l.receivedKg - l.issuedKg }));
    },
    getCottonLotsWithStock() { return this.getAllCottonLots().filter(l => l.balanceBale > 0); },
    getSelectedConsignmentData() { if (!this.cottonIssueForm.consignment) return null; return this.getAllCottonLots().find(l => l.consignment === this.cottonIssueForm.consignment); },

    // YARN FUNCTIONS
    yarnTotalReceived() { return this.yarnReceives.reduce((s, r) => s + r.quantity, 0); },
    yarnTotalIssued() { return this.yarnIssues.reduce((s, i) => s + i.quantity, 0); },
    yarnTotalStock() { return this.yarnTotalReceived() - this.yarnTotalIssued(); },
    yarnActiveCounts() { return new Set(this.yarnReceives.map(r => r.count)).size; },
    getYarnStockList() {
      const stockMap = {};
      this.yarnReceives.forEach(r => {
        const key = r.count + '-' + r.process;
        if (!stockMap[key]) stockMap[key] = { count: r.count, process: r.process, received: 0, issued: 0, balance: 0 };
        stockMap[key].received += r.quantity;
      });
      this.yarnIssues.forEach(i => {
        const key = i.count + '-' + i.process;
        if (!stockMap[key]) stockMap[key] = { count: i.count, process: i.process, received: 0, issued: 0, balance: 0 };
        stockMap[key].issued += i.quantity;
      });
      Object.values(stockMap).forEach(s => s.balance = s.received - s.issued);
      return Object.values(stockMap);
    },

    saveYarnReceive() {
      if (!this.yarnReceiveForm.count || !this.yarnReceiveForm.process) { this.toast('error', 'Error', 'Please fill required fields'); return; }

    saveYarnIssue() {

      const stock = this.getYarnStockList().find(s => s.count === this.yarnIssueForm.count && s.process === this.yarnIssueForm.process);

    requestAdminAccess(action, data) {
      this.adminModal = { open: true, password: '', error: '', action, data, pendingAction: { action, data } };
    },
    verifyAdminPassword() {
      if (this.adminModal.password === '@admin') {
        this.adminModal.open = false;
        this.toast('success', 'Verified', 'Admin action authorized');
        if (this.adminModal.pendingAction) {
          const { action, data } = this.adminModal.pendingAction;
          if (action === 'deleteCottonReceive') this.cottonReceives = this.cottonReceives.filter(r => r.id !== data.id);
          if (action === 'deleteCottonIssue') this.cottonIssues = this.cottonIssues.filter(i => i.id !== data.id);
          if (action === 'deleteWasteReceive') this.wasteReceives = this.wasteReceives.filter(r => r.id !== data.id);
          if (action === 'deleteWasteIssue') this.wasteIssues = this.wasteIssues.filter(i => i.id !== data.id);
          if (action === 'deleteSpareItem') this.spareItems = this.spareItems.filter(i => i.id !== data.id);
          if (action === 'deleteSpareReceive') this.spareReceives = this.spareReceives.filter(r => r.id !== data.id);
          if (action === 'deleteSpareIssue') this.spareIssues = this.spareIssues.filter(i => i.id !== data.id);
          if (action === 'deleteYarnReceive') this.yarnReceives = this.yarnReceives.filter(r => r.id !== data.id);
          if (action === 'deleteYarnIssue') this.yarnIssues = this.yarnIssues.filter(i => i.id !== data.id);
          if (action === 'deleteHVIReport') this.hviReports = this.hviReports.filter(h => h.id !== data.id);
          if (action === 'deleteUsterReport') this.usterReports = this.usterReports.filter(u => u.id !== data.id);
          this.saveData();
          this.adminModal.pendingAction = null;
        }
      } else {
        this.adminModal.error = 'Invalid admin password';
      }
    },

    // AUTH FUNCTIONS
    login() {
      this.auth.loading = true; this.auth.error = null;
      setTimeout(() => {
        const users = { 'store@patriot.com': { name: 'Store Manager', role: 'Store Manager' }, 'admin@patriot.com': { name: 'Admin User', role: 'Super Admin' } };
        const u = users[this.auth.email];
        if (this.auth.password === 'password' && u) {
          this.auth.user = { ...u, email: this.auth.email };
          this.auth.isAuthenticated = true;
          localStorage.setItem('patriot-auth', JSON.stringify({ user: this.auth.user, email: this.auth.email }));
          this.toast('success', 'Welcome', `Signed in as ${u.name}`);
        } else { this.auth.error = 'Invalid credentials'; }
        this.auth.loading = false;
      }, 600);
    },
    logout() { this.auth.isAuthenticated = false; this.auth.user = null; localStorage.removeItem('patriot-auth'); },
    setTheme(t) { this.ui.theme = t; document.documentElement.classList.toggle('dark', t === 'dark'); localStorage.setItem('patriot-theme', t); },
    toggleTheme() { this.setTheme(this.ui.theme === 'light' ? 'dark' : 'light'); },
    toast(type, title, message) {
      const id = Date.now() + Math.random();
      this.toasts.push({ id, type, title, message });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, 3500);
    },
  };
