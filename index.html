<!DOCTYPE html>
<html lang="en" class="light">
  <script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/database.js"></script>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patriot ERP – Complete Inventory Management</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: { 50:'#eef4ff',100:'#dbe6ff',200:'#bfd2ff',300:'#93b3ff',400:'#6189ff',500:'#3a5ffc',600:'#2541f1',700:'#1e32d8',800:'#1e2cae',900:'#1e2b89',950:'#161b54' },
          cotton: { 50:'#fef7ed',100:'#fdecd4',200:'#fad5a8',300:'#f6b871',400:'#f19038',500:'#ee7518',600:'#df5c0f',700:'#b94510',800:'#943815',900:'#7a3014' },
          waste: { 50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d' },
          spare: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d' },
          yarn: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' },
          hvi: { 50:'#faf5ff',100:'#f3e8ff',200:'#e9d5ff',300:'#d8b4fe',400:'#c084fc',500:'#a855f7',600:'#9333ea',700:'#7e22ce',800:'#6b21a8',900:'#581c87' },
          uster: { 50:'#fdf4ff',100:'#fae8ff',200:'#f5d0fe',300:'#f0abfc',400:'#e879f9',500:'#d946ef',600:'#c026d3',700:'#a21caf',800:'#86198f',900:'#701a75' }
        },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui'] }
      }
    }
  }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  html, body { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(100,116,139,.35); border-radius: 4px; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .toast-in { animation: toastIn .3s ease-out; }
  @keyframes toastIn { from{opacity:0; transform:translateY(-20px)} to{opacity:1; transform:translateY(0)} }
  .nav-item.active { background-color: rgb(37 99 235); color: white; }
  .nav-item.active svg { color: white; }
  .dark .nav-item.active { background-color: rgb(37 99 235); }
  @media print { .no-print { display: none !important; } body { background: white !important; color: black !important; } }
  .badge { display:inline-flex; align-items:center; padding:2px 10px; border-radius:9999px; font-size:11px; font-weight:600; }
  .modal-backdrop { backdrop-filter: blur(4px); }
  .auto-calc-field { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px dashed #f59e0b !important; font-weight: 600; color: #92400e; }
  .dark .auto-calc-field { background: linear-gradient(135deg, #78350f 0%, #92400e 100%); color: #fde68a; }
</style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased">

<div x-data="app()" x-init="init()" class="min-h-screen">

  <!-- LOGIN -->
  <template x-if="!auth.isAuthenticated">
    <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-brand-600 via-brand-700 to-slate-900 relative overflow-hidden">
      <div class="absolute inset-0 opacity-20">
        <div class="absolute top-20 left-20 w-72 h-72 bg-white rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-brand-400 rounded-full blur-3xl"></div>
      </div>
      <div class="relative w-full max-w-5xl grid md:grid-cols-2 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <div class="hidden md:flex flex-col justify-between p-10 bg-gradient-to-br from-brand-600 to-brand-800 text-white">
          <div>
            <div class="flex items-center gap-3 mb-8">
              <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur">
                <i data-lucide="factory" class="w-7 h-7"></i>
              </div>
              <div>
                <h1 class="text-2xl font-bold">Patriot ERP</h1>
                <p class="text-brand-100 text-sm">Complete Inventory Management</p>
              </div>
            </div>
            <h2 class="text-3xl font-bold leading-tight mb-4">Cotton · Wastage · Spare Parts · Yarn · HVI · Uster</h2>
            <p class="text-brand-100 leading-relaxed">Complete integrated inventory management with HVI & Uster quality testing.</p>
          </div>
          <div class="space-y-2 mt-8">
            <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Cotton Inventory (26 countries)</span></div>
            <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Wastage Management (20 categories)</span></div>
            <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Spare Parts (1800+ items)</span></div>
            <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>Yarn Inventory (Ring & Rotor)</span></div>
            <div class="flex items-center gap-3 text-sm"><i data-lucide="check-circle-2" class="w-5 h-5 text-brand-200"></i><span>HVI & Uster Test Reports</span></div>
          </div>
          <p class="text-xs text-brand-200 mt-8">© 2026 Patriot Spinning Mills Ltd. · Bangladesh</p>
        </div>
        <div class="p-8 md:p-12">
          <h3 class="text-2xl font-bold mb-2">Welcome back</h3>
          <p class="text-slate-500 dark:text-slate-400 mb-8">Sign in to access Complete Inventory</p>
          <form @submit.prevent="login()" class="space-y-5">
            <div><label class="block text-sm font-medium mb-2">Email</label>
              <div class="relative"><i data-lucide="mail" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="email" x-model="auth.email" required class="w-full pl-10 pr-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 focus:ring-2 focus:ring-brand-500 outline-none" placeholder="store@patriot.com" />
              </div>
            </div>
            <div><label class="block text-sm font-medium mb-2">Password</label>
              <div class="relative"><i data-lucide="lock" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input :type="showPassword?'text':'password'" x-model="auth.password" required class="w-full pl-10 pr-10 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 focus:ring-2 focus:ring-brand-500 outline-none" placeholder="••••••••" />
                <button type="button" @click="showPassword=!showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><i :data-lucide="showPassword?'eye-off':'eye'" class="w-4 h-4"></i></button>
              </div>
            </div>
            <div x-show="auth.error" x-transition class="bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-sm p-3 rounded-lg"><span x-text="auth.error"></span></div>
            <button type="submit" :disabled="auth.loading" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-50 flex items-center justify-center gap-2"><span x-text="auth.loading?'Signing in...':'Sign In'"></span></button>
          </form>
          <div class="mt-6 p-4 bg-slate-50 dark:bg-slate-700/50 rounded-lg border border-slate-200 dark:border-slate-600">
            <p class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-2">Demo Accounts:</p>
            <div class="text-xs text-slate-500 dark:text-slate-400 space-y-1">
              <div><span class="font-medium">Store Manager:</span> store@patriot.com / password</div>
              <div><span class="font-medium">Super Admin:</span> admin@patriot.com / password</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- MAIN APP -->
  <template x-if="auth.isAuthenticated">
    <div class="flex min-h-screen">

      <!-- SIDEBAR -->
      <aside :class="ui.sidebarOpen?'w-64':'w-20'" class="no-print fixed left-0 top-0 h-screen bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transition-all duration-300 z-40 flex flex-col">
        <div class="h-16 flex items-center justify-between px-4 border-b border-slate-200 dark:border-slate-700">
          <div class="flex items-center gap-2 overflow-hidden" x-show="ui.sidebarOpen" x-transition>
            <div class="w-9 h-9 bg-gradient-to-br from-brand-500 to-brand-700 rounded-lg flex items-center justify-center flex-shrink-0"><i data-lucide="factory" class="w-5 h-5 text-white"></i></div>
            <div><h1 class="font-bold text-sm leading-tight">Patriot ERP</h1><p class="text-[10px] text-slate-500 dark:text-slate-400 leading-tight">Complete Inventory</p></div>
          </div>
          <button @click="ui.sidebarOpen=!ui.sidebarOpen" class="p-1.5 rounded hover:bg-slate-100 dark:hover:bg-slate-700 transition"><i :data-lucide="ui.sidebarOpen?'panel-left-close':'panel-left-open'" class="w-5 h-5"></i></button>
        </div>

        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
          <button @click="navigate('dashboard')" :class="currentModule==='dashboard'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition"><i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Dashboard</span></button>

          <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-cotton-600 dark:text-cotton-400 uppercase">Cotton Inventory</span></div>
          <button @click="navigate('cotton-receive')" :class="currentModule==='cotton-receive'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Receive</span></button>
          <button @click="navigate('cotton-issue')" :class="currentModule==='cotton-issue'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Issue Cotton</span></button>
          <button @click="navigate('cotton-stock')" :class="currentModule==='cotton-stock'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Stock</span></button>
          <button @click="navigate('cotton-daily')" :class="currentModule==='cotton-daily'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="calendar-days" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Daily</span></button>
          <button @click="navigate('cotton-monthly')" :class="currentModule==='cotton-monthly'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="calendar-range" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Monthly</span></button>
          <button @click="navigate('cotton-reports')" :class="currentModule==='cotton-reports'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="file-bar-chart" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Cotton Reports</span></button>

          <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-waste-600 dark:text-waste-400 uppercase">Wastage Management</span></div>
          <button @click="navigate('waste-receive')" :class="currentModule==='waste-receive'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Receive</span></button>
          <button @click="navigate('waste-issue')" :class="currentModule==='waste-issue'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Issue</span></button>
          <button @click="navigate('waste-stock')" :class="currentModule==='waste-stock'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Stock</span></button>
          <button @click="navigate('waste-daily')" :class="currentModule==='waste-daily'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="calendar-days" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Daily</span></button>
          <button @click="navigate('waste-monthly')" :class="currentModule==='waste-monthly'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="calendar-range" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Monthly</span></button>
          <button @click="navigate('waste-reports')" :class="currentModule==='waste-reports'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="file-bar-chart" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Wastage Reports</span></button>

          <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-spare-600 dark:text-spare-400 uppercase">Spare Parts</span></div>
          <button @click="navigate('spare-items')" :class="currentModule==='spare-items'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="database" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Items Master</span></button>
          <button @click="navigate('spare-receive')" :class="currentModule==='spare-receive'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Receive</span></button>
          <button @click="navigate('spare-issue')" :class="currentModule==='spare-issue'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Issue</span></button>
          <button @click="navigate('spare-stock')" :class="currentModule==='spare-stock'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Stock Status</span></button>
          <button @click="navigate('spare-reports')" :class="currentModule==='spare-reports'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="file-bar-chart" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Spare Reports</span></button>

          <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-yarn-600 dark:text-yarn-400 uppercase">Yarn Inventory</span></div>
          <button @click="navigate('yarn-receive')" :class="currentModule==='yarn-receive'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-plus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Yarn Receive</span></button>
          <button @click="navigate('yarn-issue')" :class="currentModule==='yarn-issue'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="package-minus" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Yarn Issue</span></button>
          <button @click="navigate('yarn-stock')" :class="currentModule==='yarn-stock'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="archive" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Yarn Stock</span></button>
          <button @click="navigate('yarn-reports')" :class="currentModule==='yarn-reports'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="file-bar-chart" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Yarn Reports</span></button>

          <div x-show="ui.sidebarOpen" class="mt-4 mb-2 px-3 flex items-center gap-2"><span class="text-xs font-bold text-hvi-600 dark:text-hvi-400 uppercase">Quality Testing</span></div>
          <button @click="navigate('hvi-reports')" :class="currentModule==='hvi-reports'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="microscope" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">HVI Test Reports</span></button>
          <button @click="navigate('uster-reports')" :class="currentModule==='uster-reports'?'active':'hover:bg-slate-100 dark:hover:bg-slate-700/60'" class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition"><i data-lucide="test-tube" class="w-4 h-4 flex-shrink-0"></i><span x-show="ui.sidebarOpen">Uster Test Reports</span></button>
        </nav>

        <div class="p-3 border-t border-slate-200 dark:border-slate-700">
          <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/60 cursor-pointer">
            <div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-semibold flex-shrink-0" x-text="auth.user?.name?.charAt(0)||'U'"></div>
            <div class="flex-1 overflow-hidden" x-show="ui.sidebarOpen" x-transition><p class="text-sm font-semibold truncate" x-text="auth.user?.name"></p><p class="text-xs text-slate-500 dark:text-slate-400 truncate" x-text="auth.user?.role"></p></div>
          </div>
        </div>
      </aside>

      <!-- MAIN -->
      <div :class="ui.sidebarOpen?'ml-64':'ml-20'" class="flex-1 transition-all duration-300 flex flex-col min-h-screen">

        <header class="no-print sticky top-0 z-30 h-16 bg-white/80 dark:bg-slate-800/80 backdrop-blur border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6">
          <div><h2 class="text-lg font-bold" x-text="currentModuleLabel()"></h2><p class="text-xs text-slate-500 dark:text-slate-400" x-text="currentModuleSubtext()"></p></div>
          <div class="flex items-center gap-2">
            <button @click="toggleTheme()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition"><i :data-lucide="ui.theme==='dark'?'sun':'moon'" class="w-5 h-5"></i></button>
            <div class="relative">
              <button @click="ui.userMenuOpen=!ui.userMenuOpen" class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-semibold text-sm" x-text="auth.user?.name?.charAt(0)"></div>
              </button>
              <div x-show="ui.userMenuOpen" @click.away="ui.userMenuOpen=false" x-transition class="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl">
                <div class="p-3 border-b border-slate-200 dark:border-slate-700"><p class="text-sm font-semibold" x-text="auth.user?.name"></p><p class="text-xs text-slate-500" x-text="auth.user?.email"></p></div>

            </div>
          </template>

          <!-- COTTON RECEIVE -->

                          <template x-for="c in cottonCountries" :key="c"><option :value="c" x-text="c"></option></template>

                      </div>
                    </div>
                    <div><label class="block text-xs font-medium mb-1">Consignment *</label><input x-model="cottonReceiveForm.consignment" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div><label class="block text-xs font-medium mb-1">Fiber Length</label><input x-model="cottonReceiveForm.fiberLength" class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>
                    <div><label class="block text-xs font-medium mb-1">L/C Number</label><input x-model="cottonReceiveForm.lcNo" class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>
                    <div><label class="block text-xs font-medium mb-1">I D Code</label><input x-model="cottonReceiveForm.idCode" class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-medium mb-1">Received Date *</label><input type="date" x-model="cottonReceiveForm.date" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>

                <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                  <table class="w-full text-sm">
                    <thead class="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 sticky top-0">
                      <tr><th class="px-4 py-3 text-left text-xs uppercase">Date</th><th class="px-4 py-3 text-left text-xs uppercase">Origin</th><th class="px-4 py-3 text-left text-xs uppercase">Consignment</th><th class="px-4 py-3 text-left text-xs uppercase">Fiber</th><th class="px-4 py-3 text-left text-xs uppercase">L/C</th><th class="px-4 py-3 text-left text-xs uppercase">ID Code</th><th class="px-4 py-3 text-right text-xs uppercase">LC Qty</th><th class="px-4 py-3 text-right text-xs uppercase">Actual</th><th class="px-4 py-3 text-right text-xs uppercase">Kg</th><th class="px-4 py-3 text-center text-xs uppercase">Actions</th></tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                      <template x-if="cottonReceives.length===0"><tr><td colspan="10" class="px-4 py-8 text-center text-slate-500">No receive records yet.</td></tr></template>
                      <template x-for="r in [...cottonReceives].reverse()" :key="r.id">
                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30">
                          <td class="px-4 py-3 text-xs" x-text="r.date"></td>
                          <td class="px-4 py-3 text-xs" x-text="r.origin"></td>
                          <td class="px-4 py-3 text-xs" x-text="r.consignment"></td>
                          <td class="px-4 py-3 text-xs" x-text="r.fiberLength||'—'"></td>

                          <td class="px-4 py-3 text-center"><button @click="requestAdminAccess('deleteCottonReceive',r)" class="p-1.5 rounded hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>

          <!-- COTTON ISSUE -->
          <template x-if="currentModule==='cotton-issue'">
            <div class="space-y-6 fade-in">

                <div class="flex items-start gap-3"><i data-lucide="info" class="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5"></i>
                  <div><p class="font-semibold text-amber-900 dark:text-amber-200">Auto Weight Calculation</p>
                    <p class="text-sm text-amber-800 dark:text-amber-300 mt-1">Issue Bale Qty বসালে, Consignment এর Received Bale এবং Received Kg থেকে স্বয়ংক্রিয়ভাবে Issue Weight (Kg) calculate হবে।</p>
                    <p class="text-sm text-amber-800 dark:text-amber-300 mt-1 font-mono">Formula: Issue Weight = (Received Kg ÷ Received Bale) × Issue Bale Qty</p>

              </div>
              <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">

                    <div><label class="block text-xs font-medium mb-1">S R No. *</label><input x-model="cottonIssueForm.srNo" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" :placeholder="generateCottonSRNo()" /></div>
                    <div><label class="block text-xs font-medium mb-1">Issue Date *</label><input type="date" x-model="cottonIssueForm.date" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-medium mb-1">Country/Origin *</label>
                      <select x-model="cottonIssueForm.origin" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
                        <option value="">Choose Origin...</option>
                        <template x-for="c in cottonCountries" :key="c"><option :value="c" x-text="c"></option></template>
                      </select>
                    </div>
                    <div><label class="block text-xs font-medium mb-1">Consignment * (Stock Available)</label>
                      <select x-model="cottonIssueForm.consignment" @change="calculateCottonWeight()" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
                        <option value="">Choose consignment...</option>
                        <template x-for="lot in getCottonLotsWithStock()" :key="lot.consignment"><option :value="lot.consignment" x-text="lot.consignment+' (Bal: '+lot.balanceBale+' Bale / '+formatKg(lot.balanceKg)+')'"></option></template>
                      </select>
                    </div>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-medium mb-1">Process Type *</label>
                      <select x-model="cottonIssueForm.processType" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">

                      </select>
                    </div>
                    <div><label class="block text-xs font-medium mb-1">Department/Machine</label><input x-model="cottonIssueForm.department" class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-medium mb-1">Issue Bale Qty *</label><input x-model="cottonIssueForm.baleQty" @input="calculateCottonWeight()" type="number" required class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>
                    <div><label class="block text-xs font-medium mb-1">Issue Weight (Kg) * [AUTO]</label><input x-model="cottonIssueForm.weightKg" type="number" step="0.01" required readonly class="w-full px-3 py-2 text-sm auto-calc-field" /></div>

                      <div><span class="text-slate-500">Issue Weight:</span> <span class="font-semibold text-amber-700 dark:text-amber-300" x-text="formatKg(cottonIssueForm.weightKg)"></span></div>
                    </div>
                  </div>
                  <div><label class="block text-xs font-medium mb-1">Remarks</label><input x-model="cottonIssueForm.remarks" class="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700" /></div>
                  <button type="submit" class="w-full px-6 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-lg font-medium">Save Issue</button>
                </form>
              </div>
              <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                <div class="p-4 border-b border-slate-200 dark:border-slate-700"><h3 class="font-semibold">Issue History</h3></div>
                <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                  <table class="w-full text-sm">
                    <thead class="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 sticky top-0">

                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>

                <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl p-5 text-white"><p class="text-xs text-blue-100 font-medium">Current Balance</p><p class="text-3xl font-bold" x-text="cottonTotalStock()+' Bale'"></p></div>

              </div>
              <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">

                <div class="overflow-x-auto">
                  <table class="w-full text-sm">
                    <thead class="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700">
                      <tr><th class="px-4 py-3 text-left text-xs uppercase">Consignment</th><th class="px-4 py-3 text-left text-xs uppercase">Origin</th><th class="px-4 py-3 text-left text-xs uppercase">L/C</th><th class="px-4 py-3 text-right text-xs uppercase">Received Bale</th><th class="px-4 py-3 text-right text-xs uppercase">Received Kg</th><th class="px-4 py-3 text-right text-xs uppercase">Issued Bale</th><th class="px-4 py-3 text-right text-xs uppercase">Issued Kg</th><th class="px-4 py-3 text-right text-xs uppercase">Balance Bale</th><th class="px-4 py-3 text-right text-xs uppercase">Balance Kg</th><th class="px-4 py-3 text-center text-xs uppercase">Status</th></tr>

                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

    adminModal:{open:false,password:'',error:'',action:'',data:null,pendingAction:null},
    showAdminPassword:false,

    init(){
      const savedTheme=localStorage.getItem('patriot-theme')||'light';
      this.setTheme(savedTheme);
      const savedAuth=localStorage.getItem('patriot-auth');
      if(savedAuth){try{const p=JSON.parse(savedAuth);this.auth={...this.auth,...p,isAuthenticated:true};}catch(e){}}
      const savedData=localStorage.getItem('patriot-complete-inventory');
      if(savedData){try{const d=JSON.parse(savedData);this.cottonReceives=d.cottonReceives||[];this.cottonIssues=d.cottonIssues||[];this.wasteReceives=d.wasteReceives||[];this.wasteIssues=d.wasteIssues||[];this.spareItems=d.spareItems||[];this.spareReceives=d.spareReceives||[];this.spareIssues=d.spareIssues||[];this.yarnReceives=d.yarnReceives||[];this.yarnIssues=d.yarnIssues||[];this.hviReports=d.hviReports||[];this.usterReports=d.usterReports||[];}catch(e){this.seedData();}}
      else{this.seedData();}
      this.$nextTick(()=>lucide.createIcons());
    },

    seedData(){
      const today=new Date().toISOString().split('T')[0];
      this.hviReports=[{id:1,testDate:today,consignment:'CON-2026-001',mic:4.2,uhml:29.5,ui:83.5,strength:28.5,elongation:6.5,sfi:8.2,moisture:7.8,rd:75.6,yellowness:9.6,colorGrade:'31-3',trashCnt:2.5,trashAr:1.2,sci:137,remarks:'Good quality'}];
      this.usterReports=[{id:1,testDate:today,lotNo:'LOT-001',count:'20/1',process:'Ring',machine:'M-01',cvm:12.5,unevenness:14.8,thinPlaces:15,thickPlaces:120,neps:140,ipi:275,hairiness:4.2,csp:2250,remarks:'Good quality'}];
      this.saveData();
    },

    saveData(){localStorage.setItem('patriot-complete-inventory',JSON.stringify({cottonReceives:this.cottonReceives,cottonIssues:this.cottonIssues,wasteReceives:this.wasteReceives,wasteIssues:this.wasteIssues,spareItems:this.spareItems,spareReceives:this.spareReceives,spareIssues:this.spareIssues,yarnReceives:this.yarnReceives,yarnIssues:this.yarnIssues,hviReports:this.hviReports,usterReports:this.usterReports}));},

    formatKg(kg){return Math.round(kg).toLocaleString()+' kg';},
    generateCottonSRNo(){return 'SR-C-'+new Date().getFullYear()+'-'+String(this.cottonIssues.length+1).padStart(3,'0');},
    generateWasteSRNo(){return 'SR-W-'+new Date().getFullYear()+'-'+String(this.wasteIssues.length+1).padStart(3,'0');},
    generateSpareSRNo(){return 'SR-S-'+new Date().getFullYear()+'-'+String(this.spareIssues.length+1).padStart(3,'0');},

    navigate(id){this.currentModule=id;this.ui.userMenuOpen=false;this.$nextTick(()=>lucide.createIcons());},
    currentModuleLabel(){const labels={'dashboard':'Dashboard','cotton-receive':'Cotton Receive','cotton-issue':'Issue Cotton','cotton-stock':'Cotton Stock','cotton-daily':'Cotton Daily','cotton-monthly':'Cotton Monthly','cotton-reports':'Cotton Reports','waste-receive':'Wastage Receive','waste-issue':'Wastage Issue','waste-stock':'Wastage Stock','waste-daily':'Wastage Daily','waste-monthly':'Wastage Monthly','waste-reports':'Wastage Reports','spare-items':'Items Master','spare-receive':'Receive','spare-issue':'Issue','spare-stock':'Stock Status','spare-reports':'Spare Reports','yarn-receive':'Yarn Receive','yarn-issue':'Yarn Issue','yarn-stock':'Yarn Stock','yarn-reports':'Yarn Reports','hvi-reports':'HVI Test Reports','uster-reports':'Uster Test Reports'};return labels[this.currentModule]||'';},
    currentModuleSubtext(){const subtexts={'dashboard':'Overview','cotton-receive':'Receive cotton from 26 countries','cotton-issue':'Issue cotton with auto weight calculation','cotton-stock':'Cotton stock balance','cotton-daily':'Daily cotton summary','cotton-monthly':'Monthly cotton summary','cotton-reports':'Cotton reports & exports','waste-receive':'Receive wastage','waste-issue':'Issue wastage','waste-stock':'Wastage stock balance','waste-daily':'Daily wastage summary','waste-monthly':'Monthly wastage summary','waste-reports':'Wastage reports & exports','spare-items':'Manage spare parts','spare-receive':'Receive spare parts','spare-issue':'Issue spare parts','spare-stock':'Stock status','spare-reports':'Spare parts reports','yarn-receive':'Receive yarn','yarn-issue':'Issue yarn','yarn-stock':'Yarn stock balance','yarn-reports':'Yarn reports & exports','hvi-reports':'HVI test reports with quality parameters','uster-reports':'Uster evenness test reports'};return subtexts[this.currentModule]||'';},

    cottonTotalReceived(){return this.cottonReceives.reduce((s,r)=>s+r.actualReceive,0);},
    cottonTotalIssued(){return this.cottonIssues.reduce((s,i)=>s+i.baleQty,0);},
    cottonTotalStock(){return this.cottonTotalReceived()-this.cottonTotalIssued();},
    cottonActiveLots(){return new Set(this.cottonReceives.map(r=>r.consignment)).size;},
    getAllCottonLots(){const lotMap={};this.cottonReceives.forEach(r=>{if(!lotMap[r.consignment])lotMap[r.consignment]={consignment:r.consignment,origin:r.origin,lcNo:r.lcNo,receivedBale:0,receivedKg:0,issuedBale:0,issuedKg:0};lotMap[r.consignment].receivedBale+=r.actualReceive;lotMap[r.consignment].receivedKg+=r.actualReceiveKg;});this.cottonIssues.forEach(i=>{if(!lotMap[i.consignment])lotMap[i.consignment]={consignment:i.consignment,origin:i.origin,lcNo:'',receivedBale:0,receivedKg:0,issuedBale:0,issuedKg:0};lotMap[i.consignment].issuedBale+=i.baleQty;lotMap[i.consignment].issuedKg+=i.weightKg;});return Object.values(lotMap).map(l=>({...l,balanceBale:l.receivedBale-l.issuedBale,balanceKg:l.receivedKg-l.issuedKg}));},
    getCottonLotsWithStock(){return this.getAllCottonLots().filter(l=>l.balanceBale>0);},
    getSelectedConsignmentData(){if(!this.cottonIssueForm.consignment)return null;return this.getAllCottonLots().find(l=>l.consignment===this.cottonIssueForm.consignment);},
    getKgPerBale(){const lot=this.getSelectedConsignmentData();if(!lot||lot.receivedBale===0)return 0;return lot.receivedKg/lot.receivedBale;},
    calculateCottonWeight(){this.cottonIssueForm.weightKg=Math.round(this.getKgPerBale()*this.cottonIssueForm.baleQty*100)/100;},
    getCottonDailySummary(){const date=this.cottonDailyDate;const dayReceive=this.cottonReceives.filter(r=>r.date===date);const dayIssues=this.cottonIssues.filter(i=>i.date===date);return{receive:dayReceive.reduce((s,r)=>s+r.actualReceive,0),issue:dayIssues.reduce((s,i)=>s+i.baleQty,0),receiveCount:dayReceive.length,issueCount:dayIssues.length};},
    getCottonMonthlySummary(){const month=this.cottonMonthlyMonth;const monthReceive=this.cottonReceives.filter(r=>r.date.startsWith(month));const monthIssues=this.cottonIssues.filter(i=>i.date.startsWith(month));return{opening:0,receive:monthReceive.reduce((s,r)=>s+r.actualReceive,0),issue:monthIssues.reduce((s,i)=>s+i.baleQty,0),closing:monthReceive.reduce((s,r)=>s+r.actualReceive,0)-monthIssues.reduce((s,i)=>s+i.baleQty,0)};},

    saveCottonReceive(){if(!this.cottonReceiveForm.origin||!this.cottonReceiveForm.consignment){this.toast('error','Error','Please fill required fields');return;}this.cottonReceives.push({id:Date.now(),...this.cottonReceiveForm});this.saveData();this.toast('success','Saved','Cotton receive saved');this.cottonReceiveForm={origin:'',consignment:'',fiberLength:'',lcNo:'',idCode:'',date:'',lcQuantity:0,actualReceive:0,actualReceiveKg:0,remarks:''};},
    saveCottonIssue(){if(!this.cottonIssueForm.origin||!this.cottonIssueForm.consignment){this.toast('error','Error','Please fill required fields');return;}const lot=this.getAllCottonLots().find(l=>l.consignment===this.cottonIssueForm.consignment);if(!lot||this.cottonIssueForm.baleQty>lot.balanceBale){this.toast('error','Insufficient Stock','Not enough stock');return;}this.cottonIssues.push({id:Date.now(),srNo:this.cottonIssueForm.srNo||this.generateCottonSRNo(),...this.cottonIssueForm});this.saveData();this.toast('success','Saved','Cotton issue saved');this.cottonIssueForm={srNo:'',date:'',origin:'',consignment:'',processType:'',department:'',baleQty:0,weightKg:0,remarks:''};},

    wasteTotalReceived(){return this.wasteReceives.reduce((s,r)=>s+r.quantity,0);},
    wasteTotalIssued(){return this.wasteIssues.reduce((s,i)=>s+i.quantity,0);},
    wasteTotalStock(){return this.wasteTotalReceived()-this.wasteTotalIssued();},
    wasteActiveCategories(){return new Set(this.wasteReceives.map(r=>r.category)).size;},
    getAllWasteCategories(){return [...new Set(this.wasteReceives.map(r=>r.category))];},
    getWasteCategoriesWithStock(){return this.getAllWasteCategories().filter(cat=>this.getWasteCategoryBalance(cat)>0);},
    getWasteCategoryReceived(cat){return this.wasteReceives.filter(r=>r.category===cat).reduce((s,r)=>s+r.quantity,0);},
    getWasteCategoryIssued(cat){return this.wasteIssues.filter(i=>i.category===cat).reduce((s,i)=>s+i.quantity,0);},
    getWasteCategoryBalance(cat){return this.getWasteCategoryReceived(cat)-this.getWasteCategoryIssued(cat);},
    getWasteCategoryReceiveFrom(cat){const r=this.wasteReceives.find(r=>r.category===cat);return r?r.receiveFrom:'—';},
    getWasteDailySummary(){const date=this.wasteDailyDate;const dayReceive=this.wasteReceives.filter(r=>r.date===date);const dayIssues=this.wasteIssues.filter(i=>i.date===date);return{receive:dayReceive.reduce((s,r)=>s+r.quantity,0),issue:dayIssues.reduce((s,i)=>s+i.quantity,0),receiveCount:dayReceive.length,issueCount:dayIssues.length};},
    getWasteMonthlySummary(){const month=this.wasteMonthlyMonth;const monthReceive=this.wasteReceives.filter(r=>r.date.startsWith(month));const monthIssues=this.wasteIssues.filter(i=>i.date.startsWith(month));return{opening:0,receive:monthReceive.reduce((s,r)=>s+r.quantity,0),issue:monthIssues.reduce((s,i)=>s+i.quantity,0),closing:monthReceive.reduce((s,r)=>s+r.quantity,0)-monthIssues.reduce((s,i)=>s+i.quantity,0)};},

    saveWasteReceive(){if(!this.wasteReceiveForm.category||!this.wasteReceiveForm.receiveFrom){this.toast('error','Error','Please fill required fields');return;}this.wasteReceives.push({id:Date.now(),...this.wasteReceiveForm});this.saveData();this.toast('success','Saved','Wastage receive saved');this.wasteReceiveForm={category:'',receiveFrom:'',date:'',quantity:0,receivedBy:'',remarks:''};},
    saveWasteIssue(){if(!this.wasteIssueForm.category||!this.wasteIssueForm.issueTo){this.toast('error','Error','Please fill required fields');return;}const balance=this.getWasteCategoryBalance(this.wasteIssueForm.category);if(this.wasteIssueForm.quantity>balance){this.toast('error','Insufficient Stock','Not enough stock');return;}this.wasteIssues.push({id:Date.now(),srNo:this.wasteIssueForm.srNo||this.generateWasteSRNo(),...this.wasteIssueForm});this.saveData();this.toast('success','Saved','Wastage issue saved');this.wasteIssueForm={srNo:'',date:'',category:'',issueTo:'',issueType:'',quantity:0,issuedBy:'',remarks:''};},

    getFilteredSpareItems(){let filtered=this.spareItems;if(this.spareFilterSource)filtered=filtered.filter(i=>i.source===this.spareFilterSource);if(this.spareFilterSection)filtered=filtered.filter(i=>i.section===this.spareFilterSection);if(this.spareSearchQuery){const q=this.spareSearchQuery.toLowerCase();filtered=filtered.filter(i=>i.name.toLowerCase().includes(q)||(i.partNumber&&i.partNumber.toLowerCase().includes(q)));}return filtered;},
    getSpareReceivedQty(itemId){return this.spareReceives.filter(r=>r.itemId===itemId).reduce((s,r)=>s+r.quantity,0);},
    getSpareIssuedQty(itemId){return this.spareIssues.filter(i=>i.itemId===itemId).reduce((s,i)=>s+i.quantity,0);},

    openAddSpareItemModal(){this.addSpareItemModal={open:true,editing:false,id:null,itemName:'',partNumber:'',section:'',source:'',unit:'',openingStock:0,currentStock:0,minStock:0,location:''};},
    editSpareItem(item){this.addSpareItemModal={open:true,editing:true,id:item.id,itemName:item.name,partNumber:item.partNumber,section:item.section,source:item.source,unit:item.unit,openingStock:item.openingStock,currentStock:item.currentStock,minStock:item.minStock,location:item.location};},
    saveSpareItemForm(){if(!this.addSpareItemModal.itemName||!this.addSpareItemModal.section||!this.addSpareItemModal.source||!this.addSpareItemModal.unit){this.toast('error','Error','Please fill required fields');return;}if(this.addSpareItemModal.editing){const idx=this.spareItems.findIndex(i=>i.id===this.addSpareItemModal.id);if(idx>=0)this.spareItems[idx]={...this.addSpareItemModal,id:this.addSpareItemModal.id};this.toast('success','Updated','Item updated');}else{this.spareItems.push({id:Date.now(),...this.addSpareItemModal});this.toast('success','Added','Item added');}this.saveData();this.addSpareItemModal.open=false;},

    saveSpareReceive(){if(!this.spareReceiveForm.itemId){this.toast('error','Error','Please select item');return;}const item=this.spareItems.find(i=>i.id===parseInt(this.spareReceiveForm.itemId));if(item)item.currentStock+=parseInt(this.spareReceiveForm.quantity);this.spareReceives.push({id:Date.now(),...this.spareReceiveForm,itemId:parseInt(this.spareReceiveForm.itemId)});this.saveData();this.toast('success','Received','Spare part received');this.spareReceiveForm={itemId:'',quantity:0,mrrNo:'',date:'',remarks:''};},
    saveSpareIssue(){if(!this.spareIssueForm.itemId||!this.spareIssueForm.issueTo){this.toast('error','Error','Please fill required fields');return;}const item=this.spareItems.find(i=>i.id===parseInt(this.spareIssueForm.itemId));if(!item)return;if(this.spareIssueForm.quantity>item.currentStock){this.toast('error','Insufficient Stock','Not enough stock');return;}item.currentStock-=parseInt(this.spareIssueForm.quantity);this.spareIssues.push({id:Date.now(),srNo:this.spareIssueForm.srNo||this.generateSpareSRNo(),...this.spareIssueForm,itemId:parseInt(this.spareIssueForm.itemId)});this.saveData();this.toast('success','Issued','Spare part issued');this.spareIssueForm={itemId:'',quantity:0,issueTo:'',srNo:'',date:'',remarks:''};},

    yarnTotalReceived(){return this.yarnReceives.reduce((s,r)=>s+r.quantity,0);},
    yarnTotalIssued(){return this.yarnIssues.reduce((s,i)=>s+i.quantity,0);},
    yarnTotalStock(){return this.yarnTotalReceived()-this.yarnTotalIssued();},
    yarnActiveCounts(){return new Set(this.yarnReceives.map(r=>r.count)).size;},
    getYarnStockList(){const stockMap={};this.yarnReceives.forEach(r=>{const key=r.count+'-'+r.process;if(!stockMap[key])stockMap[key]={count:r.count,process:r.process,received:0,issued:0,balance:0};stockMap[key].received+=r.quantity;});this.yarnIssues.forEach(i=>{const key=i.count+'-'+i.process;if(!stockMap[key])stockMap[key]={count:i.count,process:i.process,received:0,issued:0,balance:0};stockMap[key].issued+=i.quantity;});Object.values(stockMap).forEach(s=>s.balance=s.received-s.issued);return Object.values(stockMap);},

    saveYarnReceive(){if(!this.yarnReceiveForm.count||!this.yarnReceiveForm.process){this.toast('error','Error','Please fill required fields');return;}this.yarnReceives.push({id:Date.now(),...this.yarnReceiveForm});this.saveData();this.toast('success','Saved','Yarn receive saved');this.yarnReceiveForm={count:'',lotNo:'',process:'',quantity:0,bags:0,date:'',remarks:''};},
    saveYarnIssue(){if(!this.yarnIssueForm.count||!this.yarnIssueForm.issueTo){this.toast('error','Error','Please fill required fields');return;}const stock=this.getYarnStockList().find(s=>s.count===this.yarnIssueForm.count&&s.process===this.yarnIssueForm.process);if(!stock||this.yarnIssueForm.quantity>stock.balance){this.toast('error','Insufficient Stock','Not enough stock');return;}this.yarnIssues.push({id:Date.now(),...this.yarnIssueForm});this.saveData();this.toast('success','Saved','Yarn issue saved');this.yarnIssueForm={count:'',lotNo:'',process:'',issueTo:'',quantity:0,bags:0,date:'',remarks:''};},

    getFilteredHVIReports(){let filtered=this.hviReports;if(this.hviSearchQuery){const q=this.hviSearchQuery.toLowerCase();filtered=filtered.filter(h=>(h.consignment&&h.consignment.toLowerCase().includes(q)));}if(this.hviFilterProcess)filtered=filtered.filter(h=>h.process===this.hviFilterProcess);return filtered;},
    openAddHVIModal(){this.hviForm={id:null,testDate:new Date().toISOString().split('T')[0],consignment:'',mic:'',uhml:'',ui:'',strength:'',elongation:'',sfi:'',moisture:'',rd:'',yellowness:'',colorGrade:'',trashCnt:0,trashAr:0,sci:0,remarks:''};this.hviModal={open:true,editing:false};},
    editHVIReport(h){this.hviForm={...h};this.hviModal={open:true,editing:true};},
    saveHVIForm(){if(!this.hviForm.testDate||!this.hviForm.consignment){this.toast('error','Error','Please fill required fields');return;}if(this.hviModal.editing){const idx=this.hviReports.findIndex(h=>h.id===this.hviForm.id);if(idx>=0)this.hviReports[idx]={...this.hviForm};this.toast('success','Updated','HVI report updated');}else{this.hviReports.push({id:Date.now(),...this.hviForm});this.toast('success','Added','HVI report added');}this.saveData();this.hviModal.open=false;},

    getFilteredUsterReports(){let filtered=this.usterReports;if(this.usterSearchQuery){const q=this.usterSearchQuery.toLowerCase();filtered=filtered.filter(u=>(u.lotNo&&u.lotNo.toLowerCase().includes(q))||(u.count&&u.count.toLowerCase().includes(q))||(u.machine&&u.machine.toLowerCase().includes(q)));}if(this.usterFilterProcess)filtered=filtered.filter(u=>u.process===this.usterFilterProcess);return filtered;},
    openAddUsterModal(){this.usterForm={id:null,testDate:new Date().toISOString().split('T')[0],lotNo:'',count:'',process:'',machine:'',cvm:'',unevenness:'',thinPlaces:'',thickPlaces:'',neps:'',ipi:'',hairiness:'',csp:'',remarks:''};this.usterModal={open:true,editing:false};},
    editUsterReport(u){this.usterForm={...u};this.usterModal={open:true,editing:true};},
    saveUsterForm(){if(!this.usterForm.testDate||!this.usterForm.lotNo||!this.usterForm.count){this.toast('error','Error','Please fill required fields');return;}if(this.usterModal.editing){const idx=this.usterReports.findIndex(u=>u.id===this.usterForm.id);if(idx>=0)this.usterReports[idx]={...this.usterForm};this.toast('success','Updated','Uster report updated');}else{this.usterReports.push({id:Date.now(),...this.usterForm});this.toast('success','Added','Uster report added');}this.saveData();this.usterModal.open=false;},

    openAddCountryModal(){this.addCountryModal={open:true,countryName:''};},
    saveNewCountry(){if(this.addCountryModal.countryName&&!this.cottonCountries.includes(this.addCountryModal.countryName)){this.cottonCountries.push(this.addCountryModal.countryName);this.saveData();this.toast('success','Added','Country added successfully');}this.addCountryModal.open=false;},
    openAddWasteCategoryModal(){this.addWasteCategoryModal={open:true,categoryName:''};},
    saveNewWasteCategory(){if(this.addWasteCategoryModal.categoryName&&!this.wasteCategories.includes(this.addWasteCategoryModal.categoryName)){this.wasteCategories.push(this.addWasteCategoryModal.categoryName);this.saveData();this.toast('success','Added','Category added successfully');}this.addWasteCategoryModal.open=false;},

    requestAdminAccess(action,data){this.adminModal={open:true,password:'',error:'',action,data,pendingAction:{action,data}};},
    verifyAdminPassword(){if(this.adminModal.password==='@admin'){this.adminModal.open=false;this.toast('success','Verified','Admin action authorized');if(this.adminModal.pendingAction){const{action,data}=this.adminModal.pendingAction;if(action==='deleteCottonReceive')this.cottonReceives=this.cottonReceives.filter(r=>r.id!==data.id);if(action==='deleteCottonIssue')this.cottonIssues=this.cottonIssues.filter(i=>i.id!==data.id);if(action==='deleteWasteReceive')this.wasteReceives=this.wasteReceives.filter(r=>r.id!==data.id);if(action==='deleteWasteIssue')this.wasteIssues=this.wasteIssues.filter(i=>i.id!==data.id);if(action==='deleteSpareItem')this.spareItems=this.spareItems.filter(i=>i.id!==data.id);if(action==='deleteSpareReceive')this.spareReceives=this.spareReceives.filter(r=>r.id!==data.id);if(action==='deleteSpareIssue')this.spareIssues=this.spareIssues.filter(i=>i.id!==data.id);if(action==='deleteYarnReceive')this.yarnReceives=this.yarnReceives.filter(r=>r.id!==data.id);if(action==='deleteYarnIssue')this.yarnIssues=this.yarnIssues.filter(i=>i.id!==data.id);if(action==='deleteHVIReport')this.hviReports=this.hviReports.filter(h=>h.id!==data.id);if(action==='deleteUsterReport')this.usterReports=this.usterReports.filter(u=>u.id!==data.id);this.saveData();this.adminModal.pendingAction=null;}}else{this.adminModal.error='Invalid admin password';}},

    exportCottonDailyExcel(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([this.getCottonDailySummary()]),'Daily');XLSX.writeFile(wb,`Cotton_Daily_${this.cottonDailyDate}.xlsx`);this.toast('success','Exported','Excel downloaded');},
    exportCottonDailyPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.text('Cotton Daily Summary - '+this.cottonDailyDate,14,15);doc.autoTable({head:[['Total Receive','Total Issue','Receive Count','Issue Count']],body:[[this.getCottonDailySummary().receive,this.getCottonDailySummary().issue,this.getCottonDailySummary().receiveCount,this.getCottonDailySummary().issueCount]],startY:25});doc.save(`Cotton_Daily_${this.cottonDailyDate}.pdf`);this.toast('success','Exported','PDF downloaded');},
    exportCottonMonthlyExcel(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([this.getCottonMonthlySummary()]),'Monthly');XLSX.writeFile(wb,`Cotton_Monthly_${this.cottonMonthlyMonth}.xlsx`);this.toast('success','Exported','Excel downloaded');},
    exportCottonMonthlyPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.text('Cotton Monthly Summary - '+this.cottonMonthlyMonth,14,15);doc.autoTable({head:[['Opening','Received','Issued','Closing']],body:[[this.getCottonMonthlySummary().opening,this.getCottonMonthlySummary().receive,this.getCottonMonthlySummary().issue,this.getCottonMonthlySummary().closing]],startY:25});doc.save(`Cotton_Monthly_${this.cottonMonthlyMonth}.pdf`);this.toast('success','Exported','PDF downloaded');},
    exportCottonReceiveExcel(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(this.cottonReceives),'Receive');XLSX.writeFile(wb,`Cotton_Receive_${new Date().toISOString().split('T')[0]}.xlsx`);this.toast('success','Exported','Excel downloaded');},

    login(){this.auth.loading=true;this.auth.error=null;setTimeout(()=>{const users={'store@patriot.com':{name:'Store Manager',role:'Store Manager'},'admin@patriot.com':{name:'Admin User',role:'Super Admin'}};const u=users[this.auth.email];if(this.auth.password==='password'&&u){this.auth.user={...u,email:this.auth.email};this.auth.isAuthenticated=true;localStorage.setItem('patriot-auth',JSON.stringify({user:this.auth.user,email:this.auth.email}));this.toast('success','Welcome',`Signed in as ${u.name}`);}else{this.auth.error='Invalid credentials';}this.auth.loading=false;},600);},
    logout(){this.auth.isAuthenticated=false;this.auth.user=null;localStorage.removeItem('patriot-auth');},
    setTheme(t){this.ui.theme=t;document.documentElement.classList.toggle('dark',t==='dark');localStorage.setItem('patriot-theme',t);},
    toggleTheme(){this.setTheme(this.ui.theme==='light'?'dark':'light');},
    toast(type,title,message){const id=Date.now()+Math.random();this.toasts.push({id,type,title,message});setTimeout(()=>{this.toasts=this.toasts.filter(t=>t.id!==id);},3500);},
