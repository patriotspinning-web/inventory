<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patriot Spinning Inventory</title>
    <!-- Tailwind CSS for fast, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold mb-4 text-center text-blue-800">Patriot Spinning</div>
            <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-3 border rounded">
            <input type="password" id="password" placeholder="Password" class="w-full p-2 mb-4 border rounded">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
        </div>
    </div>

    <!-- MAIN APP SCREEN (Hidden by default) -->
    <div id="app-screen" class="hidden">
        <!-- Top Navigation -->
        <nav class="bg-blue-800 text-white p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Patriot Spinning ERP</div>
            <div class="flex items-center gap-4">
                <span id="user-role-display" class="bg-blue-700 px-3 py-1 rounded text-sm capitalize"></span>
                <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded text-sm">Logout</button>
            </div>
        </nav>

        <!-- Role-Based Views -->
        <div class="p-6">
            <!-- STORE PC VIEW -->
            <div id="store-view" class="hidden">
                <h2 class="text-2xl font-bold mb-4">Store Management</h2>
                <div class="bg-white p-4 rounded shadow mb-4">
                    <h3 class="font-bold mb-2">Receive / Issue Item</div>
                    <input type="text" id="item-name" placeholder="Item Name" class="border p-2 rounded w-full mb-2">
                    <input type="number" id="qty" placeholder="Quantity" class="border p-2 rounded w-full mb-2">
                    <select id="trans-type" class="border p-2 rounded w-full mb-2">
                        <option value="receive">Receive</option>
                        <option value="issue">Issue</option>
                    </select>
                    <button onclick="processTransaction()" class="bg-green-600 text-white px-4 py-2 rounded">Submit</button>
                </div>
            </div>

            <!-- QUALITY PC VIEW -->
            <div id="quality-view" class="hidden">
                <h2 class="text-2xl font-bold mb-4">Quality Control</h2>
                <div class="bg-white p-4 rounded shadow">
                    <h3 class="font-bold mb-2">Log Quality Check</div>
                    <input type="text" id="qc-item" placeholder="Item / Batch ID" class="border p-2 rounded w-full mb-2">
                    <input type="text" id="qc-result" placeholder="Pass / Fail / Notes" class="border p-2 rounded w-full mb-2">
                    <button onclick="logQuality()" class="bg-purple-600 text-white px-4 py-2 rounded">Log QC</button>
                </div>
            </div>

            <!-- AGM / MANAGER MOBILE VIEW -->
            <div id="agm-view" class="hidden">
                <h2 class="text-2xl font-bold mb-4">Management Dashboard</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded shadow text-center">
                        <h3 class="text-gray-500">Total Inventory Items</h3>
                        <p id="total-items" class="text-3xl font-bold text-blue-800">0</p>
                    </div>
                    <div class="bg-white p-4 rounded shadow text-center">
                        <h3 class="text-gray-500">Low Stock Alerts</h3>
                        <p id="low-stock-count" class="text-3xl font-bold text-red-600">0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Initialize Supabase (Replace with your actual Supabase URL and Anon Key)
        const SUPABASE_URL = 'https://xkutxclbslyigkoeddbm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhrdXR4Y2xic2x5aWdrb2VkZGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODk0NzUsImV4cCI6MjEwMTA2NTQ3NX0.4vrWNqjXdVqKWEygVcwVa05cDRh9NN69-I6cgoSng2E';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        // 2. Authentication Logic
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login failed: ' + error.message);
                return;
            }
            
            currentUser = data.user;
            await loadUserProfile();
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // 3. Load User Profile & Route to Correct View
        async function loadUserProfile() {
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role, full_name')
                .eq('id', currentUser.id)
                .single();

            if (profile) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-role-display').innerText = profile.role;

                // Show view based on role
                if (profile.role === 'store') document.getElementById('store-view').classList.remove('hidden');
                if (profile.role === 'quality') document.getElementById('quality-view').classList.remove('hidden');
                if (profile.role === 'agm' || profile.role === 'production') {
                    document.getElementById('agm-view').classList.remove('hidden');
                    loadDashboardStats();
                }
            }
        }

        // 4. Store PC: Process Receive/Issue
        async function processTransaction() {
            const itemName = document.getElementById('item-name').value;
            const qty = parseFloat(document.getElementById('qty').value);
            const type = document.getElementById('trans-type').value;

            // Upsert inventory item (create if not exists)
            const { data: itemData, error: itemError } = await supabase
                .from('inventory')
                .upsert({ item_name: itemName, current_stock: 0, unit: 'pcs' }, { onConflict: 'item_name' })
                .select()
                .single();

            if (itemError) { alert('Error saving item'); return; }

            // Update stock mathematically
            const newStock = type === 'receive' ? itemData.current_stock + qty : itemData.current_stock - qty;
            await supabase.from('inventory').update({ current_stock: newStock }).eq('id', itemData.id);

            // Log the transaction
            await supabase.from('transactions').insert({
                item_id: itemData.id,
                transaction_type: type,
                quantity: qty,
                performed_by: currentUser.id,
                notes: 'Processed via Store PC'
            });

            alert('Transaction successful!');
            document.getElementById('item-name').value = '';
            document.getElementById('qty').value = '';
        }

        // 5. Quality PC: Log Quality Check
        async function logQuality() {
            const itemName = document.getElementById('qc-item').value;
            const notes = document.getElementById('qc-result').value;

            await supabase.from('transactions').insert({
                item_name: itemName, // Simplified for demo
                transaction_type: 'quality_check',
                quantity: 0,
                performed_by: currentUser.id,
                notes: notes
            });
            alert('Quality check logged!');
        }

        // 6. AGM/Manager: Load Dashboard Stats
        async function loadDashboardStats() {
            const { count: total } = await supabase.from('inventory').select('*', { count: 'exact', head: true });
            const { count: low } = await supabase.from('inventory').select('*', { count: 'exact', head: true }).lt('current_stock', 'min_threshold');
            
            document.getElementById('total-items').innerText = total || 0;
            document.getElementById('low-stock-count').innerText = low || 0;
        }

        // Check if already logged in on page load
        supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                currentUser = session.user;
                loadUserProfile();
            }
        });
    </script>
</body>
</html>
